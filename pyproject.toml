[project]
name = "monibox"
version = "0.1.0"
description = "面向灾害受困场景的离线边缘交互系统"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MoniBox Team" },
]

dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
]

[project.scripts]
monibox = "app.cli:main"
monibox-api = "api.main:main"
monibox-build-rag = "devtools.build_rag:main"
monibox-chat = "devtools.chat:main"
monibox-protocol-mock = "devtools.protocol_mock:main"
monibox-rag = "devtools.rag_query:main"
monibox-ui = "webui.launch:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
env = [
  "python-dotenv>=1.0.1",
]
json = [
  "json5>=0.14",
]
knowledge = [
  "numpy>=2.0",
  "openai>=2.41",
  "sentence-transformers>=5",
  "sqlite-vec>=0.1.6",
]
local-llm = [
  "llama-cpp-python>=0.3",
]
perf = [
  "psutil>=6.0.0",
]
remote-llm = [
  "openai>=2.41",
]
tools = [
  "soundfile>=0.12.1",
]
voice = [
  "comtypes>=1.4.16; sys_platform == 'win32'",
  "numpy>=2.0",
  "sounddevice>=0.5",
  "pyttsx3>=2.90",
  "faster-whisper>=1.0.3",
  "sherpa-onnx>=1.12.29",
  "pywin32>=306; sys_platform == 'win32'",
]
webui = [
  "streamlit>=1.38.0",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "app",
  "api",
  "core",
  "devices",
  "devtools",
  "knowledgekit",
  "language",
  "runtime",
  "speech",
  "webui",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "SIM",
  "RET",
  "ARG",
  "TRY",
  "S",
  "UP",
  "RUF",
]
ignore = [
  "E501",
  "PLC0415",
  "RUF001",
  "RUF002",
  "RUF003",
  "TRY003",
  "TRY004",
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"runtime/rag_engine.py" = ["S608"]
"tests/**/*.py" = ["S101"]

[tool.uv]
default-groups = []
package = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "pymoo>=0.6.1.6",
]
