[project]
name = "monibox"
version = "0.1.0"
description = "面向灾害受困场景的离线边缘交互系统"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MoniBox Team" },
]

dependencies = [
  "dotenv>=0.9.9",
  "faster-whisper>=1.2.1",
  "json5>=0.14",
  "numpy>=2.0",
  "openai>=2",
  "psutil>=6.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "sentence-transformers>=5",
  "sounddevice>=0.5.5",
  "sqlite-vec>=0.1.6",
  "tqdm>=4.66.0",
]

[project.scripts]
monibox = "monibox.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]
local-llm = [
  "llama-cpp-python>=0.3",
]
voice = [
  "sounddevice>=0.5",
  "soundfile>=0.12.1",
  "pyttsx3>=2.90",
  "faster-whisper>=1.0.3",
  "sherpa-onnx>=1.12.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monibox"]

[tool.uv]
default-groups = []
package = true
