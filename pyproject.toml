[project]
name = "monibox"
version = "0.1.0"
description = "面向灾害受困场景的离线边缘交互系统"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MoniBox Team" },
]

dependencies = [
  "numpy>=2.0",
  "openai>=2.41",
  "psutil>=6.0.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0",
  "sentence-transformers>=5",
  "soundfile>=0.12.1",
  "sqlite-vec>=0.1.6"
]

[project.scripts]
monibox = "app.cli:main"
monibox-api = "api.main:main"
monibox-build-rag = "devtools.build_rag:main"
monibox-chat = "devtools.chat:main"
monibox-de = "experiments.de_pymoo_optimize:main"
monibox-eval = "benchmarks.run_eval:main"
monibox-protocol-mock = "devtools.protocol_mock:main"
monibox-rag = "devtools.rag_query:main"

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.15.11",
]
json = [
  "json5>=0.14",
]
local-llm = [
  "llama-cpp-python>=0.3",
]
paper = [
  "pymoo>=0.6.1.6",
  "pandas>=2",
  "matplotlib>=3",
]
voice = [
  "comtypes>=1.4.16; sys_platform == 'win32'",
  "numpy>=2.0",
  "sounddevice>=0.5",
  "pyttsx3>=2.90",
  "faster-whisper>=1.0.3",
  "sherpa-onnx>=1.12.29",
  "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "jupyter>=1.1.1",
  "matplotlib>=3.10.9",
  "pandas>=3.0.3",
  "pymoo>=0.6.1.6",
  "pytest>=9.0.0",
  "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "app",
  "api",
  "benchmarks",
  "core",
  "devices",
  "devtools",
  "experiments",
  "knowledgekit",
  "language",
  "runtime",
  "speech",
]

[tool.uv]
managed = false
package = false
default-groups = []

[tool.ruff]
fix = true
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "unit: fast deterministic unit tests",
  "integration: lightweight integration tests with fakes",
  "paper: paper reproduction contract tests",
  "slow: slow/manual tests not run in default CI",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "E",
  "W",
  "F",
  "B",
  "C4",
  "EM",
  "FA",
  "G",
  "INT",
  "PIE",
  "PT",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "SLOT",
  "T10",
  "YTT",
  "DTZ",
  "I",
  "ISC",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP"
]
fixable = ["ALL"]
ignore = [
  "EM101",
  "EM102",
  "ISC001",
  "E501",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true
