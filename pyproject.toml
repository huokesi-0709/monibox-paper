[project]
name = "monibox"
version = "0.1.0"
description = "面向灾害受困场景的离线边缘交互系统"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MoniBox Team" },
]

dependencies = [
  "json5>=0.14",
  "numpy>=2.0",
  "psutil>=6.0.0",
  "python-dotenv>=1.0.1",
  "sqlite-vec>=0.1.6",
]

[project.scripts]
monibox = "app.cli:main"
monibox-chat = "devtools.chat:main"
monibox-rag = "devtools.rag_query:main"
monibox-protocol-mock = "devtools.protocol_mock:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]
local-llm = [
  "llama-cpp-python>=0.3",
]
remote-llm = [
  "openai>=2.41",
]
knowledge = [
  "openai>=2.41",
  "sentence-transformers>=5",
]
voice = [
  "comtypes>=1.4.16",
  "sounddevice>=0.5",
  "soundfile>=0.12.1",
  "pyttsx3>=2.90",
  "faster-whisper>=1.0.3",
  "sherpa-onnx>=1.12.29",
  "pywin32>=306; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "app",
  "core",
  "devices",
  "devtools",
  "knowledgekit",
  "language",
  "runtime",
  "speech",
]

[tool.uv]
default-groups = []
package = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "SIM",
  "RET",
  "ARG",
  "TRY",
  "S",
  "UP",
  "RUF",
]
ignore = [
  "E501",
  "PLC0415",
  "RUF001",
  "RUF002",
  "RUF003",
  "TRY003",
  "TRY004",
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
