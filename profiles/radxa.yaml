# Radxa 标准部署基线（ARM64 低功耗）
# 仅覆盖与 base.yaml 不同的字段

llm:
  ctx: 1536
  threads: 4
  temperature: 0.25

speech:
  tts:
    threads: 2
    max_chars: 76
    cache_size: 80

rag:
  max_distance: 0.42            # 与 base 相同，显式保留以文档化

rewrite:
  enabled: false

hardware:
  enable_precomputed_audio: true
  perf_warning_mb: 900
