# Radxa 轻量模式：ASR + protocol + RAG + 模板输出 + TTS（无 LLM rewrite）
# 仅覆盖与 base.yaml 不同的字段

llm:
  ctx: 1024
  threads: 3
  temperature: 0.2

speech:
  tts:
    threads: 2
    max_chars: 68
    cache_size: 60

rag:
  max_distance: 0.40

rewrite:
  enabled: false

hardware:
  enable_precomputed_audio: true
  perf_warning_mb: 800
