<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:24px}.title{font-size:34px;font-weight:700;fill:#0b3d86}.box{fill:#fff;stroke:#0b4f9f;stroke-width:3;rx:14}.gray{stroke:#777;fill:#fbfbfb}.orange{stroke:#e67700;fill:#fff8ed}.green{stroke:#16833a;fill:#f5fff5}.red{stroke:#d62728;fill:#fff7f7;stroke-dasharray:10 7}.small{font-size:19px}.arrow{stroke:#555;stroke-width:4;marker-end:url(#a);fill:none}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs><rect x="20" y="20" width="850" height="610" class="box"/><text x="55" y="70" class="title">1 Prototype hardware platform</text><rect x="80" y="120" width="230" height="120" class="gray"/><text x="195" y="160" text-anchor="middle" font-weight="700">INMP441 microphone</text><text x="195" y="200" text-anchor="middle" class="small">reserved; not used</text><rect x="80" y="300" width="230" height="120" class="gray"/><text x="195" y="340" text-anchor="middle" font-weight="700">MAX98357A speaker</text><text x="195" y="380" text-anchor="middle" class="small">TTS latency not reported</text><rect x="80" y="480" width="230" height="120" class="gray"/><text x="195" y="520" text-anchor="middle" font-weight="700">OLED / WS2812B LED</text><text x="195" y="560" text-anchor="middle" class="small">excluded from statistics</text><rect x="365" y="120" width="250" height="300" class="box"/><text x="490" y="170" text-anchor="middle" class="title">Radxa Zero 3W</text><text x="490" y="225" text-anchor="middle">RAIR routing</text><text x="490" y="275" text-anchor="middle">local RAG retrieval</text><text x="490" y="325" text-anchor="middle">local 0.5B generator</text><text x="490" y="375" text-anchor="middle">diagnostic scripts</text><rect x="385" y="465" width="210" height="140" class="orange"/><text x="490" y="5