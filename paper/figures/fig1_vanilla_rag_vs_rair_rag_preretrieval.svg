<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="white"/><style>text{font-family:Arial, sans-serif;font-size:28px;fill:#111} .title{font-size:42px;font-weight:700}.box{fill:#f7fbff;stroke:#0b4f9f;stroke-width:4;rx:18}.green{stroke:#117a2d}.orange{stroke:#e67700}.red{stroke:#d62728}.arrow{stroke:#137333;stroke-width:7;marker-end:url(#a);fill:none}.dash{stroke:#c00;stroke-width:4;stroke-dasharray:10 8;fill:none}.small{font-size:22px}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#137333"/></marker></defs><text x="700" y="70" text-anchor="middle" class="title">Vanilla-RAG</text><rect x="70" y="135" width="220" height="190" class="box"/><text x="180" y="175" text-anchor="middle" font-weight="700">Raw input</text><text x="180" y="225" text-anchor="middle" class="small">leg pain +</text><text x="180" y="255" text-anchor="middle" class="small">no bleeding +</text><text x="180" y="285" text-anchor="middle" class="small">low battery</text><rect x="430" y="145" width="230" height="160" class="box"/><text x="545" y="240" text-anchor="middle" font-weight="700">Retriever</text><rect x="800" y="145" width="230" height="160" class="box orange"/><text x="915" y="240" text-anchor="middle" font-weight="700">Generator</text><rect x="1160" y="135" width="220" height="190" class="box red"/><text x="1270" y="210" text-anchor="middle" font-weight="700">Response may</text><text x="1270" y="245" text-anchor="middle" font-weight="700">follow wrong</text><text x="1270" y="280" text-anchor="middle" font-weight="700">protocol</text><path d="M300 230 H420" class="arrow"/><path d="M670 230 H790" class="arrow"/><path d="M1040 230 H1150" class="arrow"/><path d="M180 333 C180 390 1220 385 1270 333" class="dash"/><text x="700" y="415" text-anchor="middle" fill="#b00000" font-weight="700">Negation and priority may be lost before retrieval</text><line x1="40" y1="455" x2="1360" y2="455" stroke="#bbb" stroke-width="3" stroke-dasharray="10 8"/><text x="700" y="535" text-anchor="middle" class="title">RAIR-RAG</text><rect x="70" y="625" width="220" height="190" class="box"/><text x="180" y="670" text-anchor="middle" font-weight="700">Raw input</text><text x="180" y="725" text-anchor="middle" class="small">leg pain +</text><text x="180" y="755" text-anchor="middle" class="small">no bleeding +</text><text x="180" y="785" text-anchor="middle" class="small">low battery</text><rect x="380" y="635" width="180" height="170" class="box orange"/><text x="470" y="720" text-anchor="middle" font-weight="700">RAIR</text><text x="470" y="755" text-anchor="middle" font-weight="700">risk routing</text><rect x="620" y="585" width="300" height="245" class="box green"/><text x="770" y="625" text-anchor="middle" font-weight="700" fill="#147a2e">RiskContext</text><text x="770" y="675" text-anchor="middle" class="small">primary_intent</text><text x="770" y="720" text-anchor="middle" class="small">negated_risks</text><text x="770" y="765" text-anchor="middle" class="small">constraints</text><text x="770" y="810" text-anchor="middle" class="small">suppressed_protocols</text><rect x="990" y="635" width="230" height="170" class="box"/><text x="1105" y="715" text-anchor="middle" font-weight="700">Protocol-aware</text><text x="1105" y="750" text-anchor="middle" font-weight="700">retrieval</text><rect x="1260" y="635" width="120" height="170" class="box green"/><text x="1320" y="710" text-anchor="middle" font-weight="700">Safe</text><text x="1320" y="745" text-anchor="middle" font-weight="700">response</text><path d="M300 720 H370" class="arrow"/><path d="M570 720 H610" class="arrow"/><path d="M930 720 H980" class="arrow"/><path d="M1230 720 H1250" class="arrow"/><text x="700" y="875" text-anchor="middle" fill="#147a2e" font-weight="700">Retrieval starts from structured RiskContext, preserving negation, priority, and constraints</text>