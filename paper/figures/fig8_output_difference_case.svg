<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:24px}.title{font-size:38px;font-weight:700;fill:white}.box{fill:#fff;stroke:#0b4f9f;stroke-width:3;rx:12}.red{stroke:#d62728;fill:#fff7f7}.green{stroke:#17823a;fill:#f6fff6}.small{font-size:20px}.arrow{stroke:#0b4f9f;stroke-width:5;marker-end:url(#a);fill:none}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0b4f9f"/></marker></defs><rect x="20" y="20" width="1460" height="120" class="box"/><text x="85" y="85" font-size="32" fill="#0b4f9f" font-weight="700">Input case</text><rect x="410" y="45" width="700" height="55" class="box"/><text x="760" y="82" text-anchor="middle">My leg hurts, but there is no bleeding, and my phone battery is running low.</text><text x="760" y="125" text-anchor="middle" fill="#555">The same emergency input is processed by two different pipelines.</text><rect x="30" y="170" width="700" height="560" class="red"/><rect x="245" y="155" width="250" height="55" fill="#d62728" rx="10"/><text x="370" y="193" text-anchor="middle" class="title">Vanilla-RAG</text><rect x="150" y="240" width="500" height="70" class="box"/><text x="180" y="282" fill="#0b4f9f" font-weight="700">1</text><text x="240" y="282" font-weight="700">Input processing</text><text x="240" y="307" class="small">Raw input used directly for retrieval</text><rect x="150" y="340" width="500" height="75" class="red"/><text x="180" y="385" fill="#d62728" font-weight="700">2</text><text x="240" y="385" font-weight="700">Interpreted main risk</text><text x="240" y="412" class="small">may over-trigger severe_bleeding_or_shock</text><rect x="150" y="450" width="500" height="120" class="box" stroke="#aaa"/><text x="180" y="485" fill="#d62728">⊘ Negated risk</text><text x="450" y="485">not explicitly modeled</text><text x="180" y="525" fill="#d62728">⊘ Suppressed protocol</text><text x="450" y="525">none</text><text x="180" y="565" fill="#d62728">▣ Operational constraint</text><text x="450" y="565">low_battery may be lost</text><rect x="80" y="600" width="500" height="100" class="red"/><text x="110" y="635" fill="#d62728" font-weight="700">4 Example output</text><text x="110" y="670" class="small">Check whether bleeding is still present and press the wound.</text><text x="590" y="650" fill="#d62728" font-weight="700">False protocol</text><text x="590" y="682" fill="#d62728" font-weight="700">trigger risk</text><rect x="770" y="170" width="700" height="560" class="green"/><rect x="1015" y="155" width="250" height="55" fill="#17823a" rx="10"/><text x="1140" y="193" text-anchor="middle" class="title">RAIR-RAG</text><rect x="900" y="235" width="500" height="85" class="box"/><text x="930" y="277" fill="#0b4f9f" font-weight="700">1</text><text x="990" y="277" font-weight="700">Input processing</text><text x="990" y="304" class="small">Build RiskContext before retrieval</text><rect x="900" y="350" width="500" height="130" class="green"/><text x="930" y="390" fill="#17823a" font-weight="700">2 RiskContext</text><text x="990" y="425" class="small">primary_intent: trauma_or_fracture</text><text x="990" y="455" class="small">negated_risks: [severe_bleeding_or_shock]</text><text x="990" y="485" class="small">suppressed_protocols: [prot_bleeding_control]</text><rect x="900" y="505" width="500" height="90" class="green"/><text x="930" y="545" fill="#17823a" font-weight="700">3</text><text x="990" y="545" class="small">low_battery retained as operational constraint</text><rect x="830" y="620" width="500" height="90" class="green"/><text x="860" y="655" fill="#17823a" font-weight="700">4 Example output</text><text x="860" y="688" class="small">Immobilize the leg. Do not treat as bleeding. Save battery.</text><text x="1345" y="650" fill="#17823a" font-weight="700">Safer response</text><text x="1345" y="682" fill="#17823a" font-weight="700">after risk control</text><rect x="60" y="765" width="360" height="65" class="box"/><text x="240" y="805" text-anchor="middle" fill="#0b4f9f" font-weight="700">Negation preserved</text><rect x="570" y="765" width="360" height="65" class="box"/><text x="750" y="805" text-anchor="middle" fill="#0b4f9f" font-weight="700">low_battery retained</text><rect x="1080" y="765" width="360" height="65" class="box"/><text x="1260" y="805" text-anchor="middle" fill="#0b4f9f" font-weight="700">False bleeding protocol avoided</text></svg>