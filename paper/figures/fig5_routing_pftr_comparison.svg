<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:24px}.title{font-size:38px;font-weight:700}.axis{stroke:#111;stroke-width:3}.grid{stroke:#ddd;stroke-dasharray:6 6}.blue{fill:#5ca4e8;stroke:#0b4f9f;stroke-width:3}.green{fill:#8bc46f;stroke:#2f7d32;stroke-width:3}.red{fill:#ff5a52;stroke:#b00000;stroke-width:3}.small{font-size:20px}</style><rect x="20" y="20" width="650" height="700" fill="#fff" stroke="#0b4f9f" stroke-width="3"/><text x="345" y="70" text-anchor="middle" class="title">A Main routing performance</text><line x1="95" y1="630" x2="620" y2="630" class="axis"/><line x1="95" y1="110" x2="95" y2="630" class="axis"/><g stroke="#ddd"><line x1="95" y1="526" x2="620" y2="526" class="grid"/><line x1="95" y1="422" x2="620" y2="422" class="grid"/><line x1="95" y1="318" x2="620" y2="318" class="grid"/><line x1="95" y1="214" x2="620" y2="214" class="grid"/><line x1="95" y1="110" x2="620" y2="110" class="grid"/></g><text x="60" y="635">0</text><text x="50" y="422">0.4</text><text x="50" y="214">0.8</text><text x="50" y="115">1.0</text><g><rect x="130" y="220" width="28" height="410" class="blue"/><rect x="162" y="190" width="28" height="440" class="green"/><text x="160" y="180" text-anchor="middle" class="small">0.8315</text><text x="150" y="700" transform="rotate(-35 150 700)" class="small">Keyword</text></g><g><rect x="240" y="434" width="28" height="196" class="blue"/><rect x="272" y="445" width="28" height="185" class="green"/><text x="270" y="425" text-anchor="middle" class="small">0.3771</text><text x="255" y="710" transform="rotate(-35 255 710)" class="small">BERT</text></g><g><rect x="350" y="208" width="28" height="422" class="blue"/><rect x="382" y="144" width="28" height="486" class="green"/><text x="390" y="135" text-anchor="middle" class="small">0.9354</text><text x="360" y="720" transform="rotate(-35 360 720)" class="small">w/o Neg.</text></g><g><rect x="460" y="214" width="28" height="416" class="blue"/><rect x="492" y="205" width="28" height="425" class="green"/><text x="490" y="195" text-anchor="middle" class="small">0.8202</text><text x="470" y="720" transform="rotate(-35 470 720)" class="small">w/o Multi.</text></g><g><rect x="560" y="129" width="28" height="501" class="blue"/><rect x="592" y="119" width="28" height="511" class="green"/><text x="590" y="105" text-anchor="middle" class="small">0.9831</text><text x="565" y="700" transform="rotate(-35 565 700)" class="small">RAIR</text></g><rect x="110" y="90" width="160" height="60" fill="#fff" stroke="#aaa"/><rect x="125" y="105" width="25" height="15" class="blue"/><text x="160" y="120" class="small">RouteAcc</text><rect x="125" y="130" width="25" height="15" class="green"/><text x="160" y="145" class="small">HRR</text><rect x="730" y="20" width="650" height="700" fill="#fff" stroke="#0b4f9f" stroke-width="3"/><text x="1055" y="70" text-anchor="middle" class="title">B False protocol trigger rate (PFTR)</text><text x="795" y="120" fill="#b00000" font-style="italic">Lower is better</text><line x1="805" y1="630" x2="1330" y2="630" class="axis"/><line x1="805" y1="110" x2="805" y2="630" class="axis"/><g><rect x="855" y="606" width="45" height="24" class="red"/><text x="878" y="594" text-anchor="middle" class="small">0.0083</text><rect x="970" y="516" width="45" height="114" class="red"/><text x="992" y="504" text-anchor="middle" class="small">0.0396</text><rect x="1085" y="173" width="45" height="457" class="red"/><text x="1108" y="160" text-anchor="middle" class="small">0.1583</text><rect x="1200" y="630" width="45" height="0" class="red"/><text x="1222" y="618" text-anchor="middle" class="small">0.0000</text><rect x="1315" y="612" width="45" height="18" class="red"/><text x="1338" y="600" text-anchor="middle" class="small">0.0063</text></g><text x="875" y="700" transform="rotate(-35 875 700)" class="small">Keyword</text><text x="985" y="710" transform="rotate(-35 985 710)" class="small">BERT</text><text x="1088" y="720" transform="rotate(-35 1088 720)" class="small">w/o Neg.</text><text x="1200" y="720" transform="rotate(-35 1200 720)" class="small">w/o Multi.</text><text x="1310" y="700" transform="rotate(-35 1310 700)" class="small">RAIR</text><rect x="20" y="740" width="1360" height="90" fill="#f7fbff" stroke="#0b4f9f"/><text x="700" y="780" text-anchor="middle">RAIR achieves the best main-routing performance (RouteAcc=0.9625, HRR=0.9831) while maintaining a low PFTR of 0.0063.</text><text x="700" y="815" text-anchor="middle">The zero PFTR of RAIR w/o Multi-Intent should not be interpreted as superior overall routing.</text></svg>