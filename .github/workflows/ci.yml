name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,paper]"

      - name: Run tests
        run: python -m pytest

      - name: Lint stage 13 quality gate
        run: python -m ruff check tests/test_stage13_quality_gates.py
