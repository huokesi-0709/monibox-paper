# Strong reference generator configuration for downstream generation experiments.
# Do not store API keys in this file. Set REFERENCE_LLM_API_KEY in the local
# environment before running reference generation.

provider: dashscope_openai
generator: reference-llm
role: stronger_reference_generator
model: qwen-plus
base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
temperature: 0.2
top_p: 0.8
max_tokens: 512
timeout_seconds: 120
max_retries: 2
deployment_note: >
  qwen-plus is used as a stronger hosted reference generator, not as an edge
  deployment model.
